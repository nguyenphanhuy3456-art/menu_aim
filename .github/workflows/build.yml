name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '12.x'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'
          
      - name: Save Custom Files
        run: |
          mkdir -p /tmp/custom
          cp -r lib /tmp/custom/
          cp -r android /tmp/custom/
          cp pubspec.yaml /tmp/custom/
          
      - name: Create Clean Project
        run: flutter create --project-name=menu_aim --org=com.sgcodexs .
        
      - name: Restore Custom Files
        run: |
          cp /tmp/custom/lib/main.dart lib/main.dart
          cp /tmp/custom/pubspec.yaml pubspec.yaml
          cp /tmp/custom/android/app/src/main/res/xml/accessibility_service_config.xml android/app/src/main/res/xml/accessibility_service_config.xml
          cp /tmp/custom/android/app/src/main/kotlin/com/sgcodexs/menuaim/*.kt android/app/src/main/kotlin/com/sgcodexs/menuaim/

      - name: Tự động tạo AndroidManifest.xml hoàn hảo
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.sgcodexs.menuaim">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.BIND_VPN_SERVICE" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.ACTION_MANAGE_OVERLAY_PERMISSION" />
              <application android:label="MENU AIM" android:icon="@mipmap/ic_launcher" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".AimOverlayService" android:exported="false" />
                  <service android:name=".TouchService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" />
                  </service>
                  <service android:name=".BridgeVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Tự động thêm thư viện vào pubspec.yaml
        run: |
          echo "  permission_handler: ^11.0.1" >> pubspec.yaml
          echo "  app_settings: ^5.1.1" >> pubspec.yaml

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: menu-aim-apk
          path: build/app/outputs/flutter-apk/app-release.apk
