name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '12.x'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'
          
      - name: Save Custom Files
        run: |
          mkdir -p /tmp/custom
          cp -r lib /tmp/custom/
          cp -r android /tmp/custom/
          cp pubspec.yaml /tmp/custom/
          
      - name: Create Clean Project
        run: flutter create --project-name=menu_aim --org=com.sgcodexs .
        
      - name: Restore Custom Files
        run: |
          cp /tmp/custom/lib/main.dart lib/main.dart
          cp /tmp/custom/pubspec.yaml pubspec.yaml
          cp /tmp/custom/android/app/src/main/res/xml/accessibility_service_config.xml android/app/src/main/res/xml/accessibility_service_config.xml
          cp /tmp/custom/android/app/src/main/kotlin/com/sgcodexs/menuaim/*.kt android/app/src/main/kotlin/com/sgcodexs/menuaim/

      - name: Tự động tạo AndroidManifest.xml hoàn hảo
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.sgcodexs.menuaim">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.BIND_VPN_SERVICE" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="vmess" />
                  </intent>
              </queries>
              <application android:label="MENU AIM" android:icon="@mipmap/ic_launcher" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".AimOverlayService" android:exported="false" />
                  <service android:name=".TouchService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" />
                  </service>
                  <service android:name=".BridgeVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Tự động tạo MainActivity.kt hoàn hảo
        run: |
          cat << 'EOF' > android/app/src/main/kotlin/com/sgcodexs/menuaim/MainActivity.kt
          package com.sgcodexs.menuaim

          import android.content.Intent
          import android.net.Uri
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import android.view.WindowManager

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.sgcodexs.menuaim/native"
              private val VPN_REQUEST_CODE = 1

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "requestOverlayPermission" -> {
                              val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:\$packageName"))
                              startActivity(intent)
                              result.success(true)
                          }
                          "startVpn" -> {
                              val prepareIntent = android.net.VpnService.prepare(this)
                              if (prepareIntent != null) {
                                  startActivityForResult(prepareIntent, VPN_REQUEST_CODE)
                              } else {
                                  startService(Intent(this, BridgeVpnService::class.java))
                              }
                              result.success(true)
                          }
                          "openAccessibilitySettings" -> {
                              val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                              startActivity(intent)
                              result.success(true)
                          }
                          "startOverlay" -> {
                              startService(Intent(this, AimOverlayService::class.java))
                              result.success(true)
                          }
                          "sendToV2rayNG" -> {
                              val config = call.argument<String>("config") ?: ""
                              try {
                                  val intent = Intent(Intent.ACTION_VIEW)
                                  intent.setPackage("com.v2ray.ang")
                                  intent.data = Uri.parse(config)
                                  startActivity(intent)
                                  result.success(true)
                              } catch (e: Exception) { result.success(false) }
                          }
                          "updateAimConfig" -> {
                              val sens = call.argument<Double>("sensitivity")?.toFloat() ?: 1.8f
                              val yMulti = call.argument<Double>("yMultiplier")?.toFloat() ?: 1.25f
                              TouchService.getInstance()?.let {
                                  it.sensitivityMultiplier = sens
                                  it.yAxisMultiplier = yMulti
                              }
                              result.success(true)
                          }
                          "toggleAntiban" -> {
                              val enable = call.argument<Boolean>("enable") ?: true
                              val intent = Intent(this, BridgeVpnService::class.java)
                              intent.putExtra("antiban", enable)
                              startService(intent)
                              result.success(true)
                          }
                          "hideApp" -> {
                              val enable = call.argument<Boolean>("enable") ?: true
                              if (enable) {
                                  window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
                              }
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == VPN_REQUEST_CODE && resultCode == RESULT_OK) {
                      startService(Intent(this, BridgeVpnService::class.java))
                  }
              }
          }
          EOF

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: menu-aim-apk
          path: build/app/outputs/flutter-apk/app-release.apk
