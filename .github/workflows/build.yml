name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '12.x'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'
          
      - name: Tự động tạo giao diện Flutter
        run: |
          mkdir -p lib
          echo "import 'package:flutter/material.dart';" > lib/main.dart
          echo "void main() => runApp(const MaterialApp(home: Scaffold(body: Center(child: Text('MENU AIM ĐÃ HOẠT ĐỘNG', style: TextStyle(fontSize: 24, color: Colors.red))))));" >> lib/main.dart
          
      - name: Create Clean Project
        run: flutter create --project-name=menu_aim --org=com.sgcodexs .
        
      - name: Giữ lại code Native của bhai
        run: |
          echo "Đã giữ lại code Android và giao diện."
          
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: menu-aim-apk
          path: build/app/outputs/flutter-apk/app-release.apk
