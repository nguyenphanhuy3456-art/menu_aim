name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '12.x'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'
          
      - name: Save Custom Files
        run: |
          mkdir -p /tmp/custom
          cp -r lib /tmp/custom/
          cp -r android /tmp/custom/
          cp pubspec.yaml /tmp/custom/
          
      - name: Create Clean Project
        run: flutter create --project-name=menu_aim --org=com.sgcodexs .
        
      - name: Restore Custom Files
        run: |
          rm -rf lib android
          cp -r /tmp/custom/lib .
          cp -r /tmp/custom/android .
          cp /tmp/custom/pubspec.yaml .

      - name: Fix MainActivity
        run: |
          cat << 'EOF' > android/app/src/main/kotlin/com/sgcodexs/menuaim/MainActivity.kt
          package com.sgcodexs.menuaim

          import android.content.Intent
          import android.net.Uri
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.sgcodexs.menuaim/native"
              private val VPN_REQUEST_CODE = 1

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "requestOverlayPermission" -> {
                              if (!Settings.canDrawOverlays(this)) {
                                  val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                                  startActivity(intent)
                              }
                              result.success(true)
                          }
                          "startVpn" -> {
                              val prepareIntent = android.net.VpnService.prepare(this)
                              if (prepareIntent != null) {
                                  startActivityForResult(prepareIntent, VPN_REQUEST_CODE)
                              } else {
                                  startService(Intent(this, BridgeVpnService::class.java))
                              }
                              result.success(true)
                          }
                          "openAccessibilitySettings" -> {
                              val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                              startActivity(intent)
                              result.success(true)
                          }
                          "startOverlay" -> {
                              if (Settings.canDrawOverlays(this)) {
                                  startService(Intent(this, AimOverlayService::class.java))
                              }
                              result.success(true)
                          }
                          "sendToV2rayNG" -> {
                              val config = call.argument<String>("config") ?: ""
                              try {
                                  val intent = Intent(Intent.ACTION_VIEW)
                                  intent.setPackage("com.v2ray.ang")
                                  intent.data = Uri.parse(config)
                                  startActivity(intent)
                                  result.success(true)
                              } catch (e: Exception) { result.success(false) }
                          }
                          "updateAimConfig" -> {
                              val sens = call.argument<Double>("sensitivity")?.toFloat() ?: 1.8f
                              val yMulti = call.argument<Double>("yMultiplier")?.toFloat() ?: 1.25f
                              TouchService.getInstance()?.let {
                                  it.sensitivityMultiplier = sens
                                  it.yAxisMultiplier = yMulti
                              }
                              result.success(true)
                          }
                          "toggleAntiban" -> {
                              val enable = call.argument<Boolean>("enable") ?: true
                              val intent = Intent(this, BridgeVpnService::class.java)
                              intent.putExtra("antiban", enable)
                              startService(intent)
                              result.success(true)
                          }
                          "hideApp" -> {
                              val enable = call.argument<Boolean>("enable") ?: true
                              if (enable) {
                                  window.addFlags(android.view.WindowManager.LayoutParams.FLAG_SECURE)
                              }
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == VPN_REQUEST_CODE && resultCode == RESULT_OK) {
                      startService(Intent(this, BridgeVpnService::class.java))
                  }
              }
          }
          EOF

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: menu-aim-apk
          path: build/app/outputs/flutter-apk/app-release.apk
