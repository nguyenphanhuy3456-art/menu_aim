name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '12.x'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.13.0'
        channel: 'stable'
        
    - name: Save custom Android and Lib files
      run: |
        mkdir -p /tmp/custom_files
        cp -r android /tmp/custom_files/ || true
        cp -r lib /tmp/custom_files/ || true
        cp pubspec.yaml /tmp/custom_files/ || true
        
    - name: Create clean Flutter project
      run: flutter create --project-name=menu_aim --org=com.sgcodexs .
      
    - name: Restore custom files
      run: |
        cp -r /tmp/custom_files/android/* android/ || true
        cp -r /tmp/custom_files/lib/* lib/ || true
        cp /tmp/custom_files/pubspec.yaml . || true
        
    - run: flutter pub get
    - run: flutter build apk --release
    - uses: actions/upload-artifact@v3
      with:
        name: menu-aim-apk
        path: build/app/outputs/flutter-apk/app-release.apk
