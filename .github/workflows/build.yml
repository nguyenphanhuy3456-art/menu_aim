name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '12.x'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.13.0'
        channel: 'stable'
    - name: Save Custom Files
      run: |
        mkdir -p /tmp/custom
        cp -r android /tmp/custom/ || true
        cp -r lib /tmp/custom/ || true
        cp pubspec.yaml /tmp/custom/ || true
    - name: Create Clean Project
      run: flutter create --project-name=menu_aim --org=com.sgcodexs .
    - name: Restore Custom Files
      run: |
        cp -r /tmp/custom/android/* android/ || true
        cp -r /tmp/custom/lib/* lib/ || true
        cp /tmp/custom/pubspec.yaml . || true
    - run: flutter pub get
    - run: flutter build apk --release
    - uses: actions/upload-artifact@v4
      with:
        name: menu-aim-apk
        path: build/app/outputs/flutter-apk/app-release.apk
